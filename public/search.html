<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>전체 문서 검색 · DevBlog</title>
<style>
:root {
  color-scheme: light dark;
  --paper: #f7f8f4;
  --surface: #ffffff;
  --ink: #18332f;
  --muted: #52645e;
  --line: #d3ddd5;
  --brand: #176451;
  --soft: #e7efe8;
  --accent: #8b4d16;
}
* { box-sizing: border-box; }
html { background: var(--paper); }
body {
  max-width: 960px; margin: 0 auto; padding: 48px 28px 80px;
  background: var(--paper); color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans KR", "Malgun Gothic", sans-serif;
  font-size: 16px; line-height: 1.7; word-break: keep-all;
  overflow-wrap: anywhere;
}
a { color: var(--brand); text-underline-offset: 4px; }
a:hover { text-decoration: underline; }
header { display: flex; align-items: center; justify-content: space-between; gap: 24px; }
h1 { font-size: clamp(28px, 4vw, 40px); line-height: 1.3; letter-spacing: -.045em; margin: 0 0 14px; font-weight: 750; }
header a, body > p > a { font-size: 14px; font-weight: 650; }
.eyebrow { color: var(--brand); font-size: 12px; font-weight: 750; letter-spacing: .16em; margin: 0 0 16px; }
.intro { max-width: 620px; color: var(--muted); margin: 0 0 24px; }
.meta, .src, .sum, .summary, .late, #status { color: var(--muted); }
.meta, #status { font-size: 13px; margin: 12px 0 24px; }
input, select, button { font: inherit; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 6px; min-height: 44px; padding: 10px 14px; }
input { min-width: 0; }
#q { width: 100%; font-size: 16px; }
input::placeholder { color: var(--muted); opacity: 1; }
button { cursor: pointer; }
button:hover { border-color: var(--brand); }
:where(a, input, select, button):focus-visible { outline: 3px solid var(--brand); outline-offset: 4px; }
.tabs, .mode { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 30px; }
.tab { font-size: 14px; padding: 7px 18px; border-radius: 999px; }
.tab.on, .mode button[aria-pressed="true"] { background: var(--brand); border-color: var(--brand); color: var(--surface); }
.controls { display: grid; grid-template-columns: minmax(0, 1fr) auto auto; gap: 10px; margin: 28px 0 12px; }
.controls input { grid-column: 1 / -1; }
.controls select { min-width: 0; }
.day { color: var(--brand); font-size: 13px; font-weight: 750; letter-spacing: .04em; margin: 36px 0 0; border-bottom: 2px solid var(--line); padding-bottom: 12px; }
.item { padding: 20px 0; border-bottom: 1px solid var(--line); }
.item a { color: var(--ink); font-size: 17px; font-weight: 650; line-height: 1.55; text-decoration: none; }
.item a:hover { color: var(--brand); text-decoration: underline; }
.src { display: block; font-size: 12px; margin: 7px 0 0; }
.sum { font-size: 14px; margin-top: 6px; line-height: 1.7; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; white-space: normal; }
.summary { font-size: 14px; line-height: 1.7; margin: 8px 0 0; }
.item .meta { font-size: 12px; margin: 7px 0 0; }
.late { font-size: 12px; }
.hit { color: var(--accent); }
.archive { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 18px; margin-top: 48px; padding-top: 20px; border-top: 1px solid var(--line); color: var(--muted); font-size: 13px; }
.path { background: var(--soft); border: 1px solid var(--line); border-radius: 8px; padding: 22px; margin: 24px 0; }
.path h2 { font-size: 18px; margin: 0 0 10px; }
.path ol { margin: 0; padding-left: 22px; }
.path li { margin: 12px 0; }
.path small { display: block; color: var(--muted); }
#more { display: block; margin: 32px auto; padding-inline: 28px; }
[hidden] { display: none !important; }
@media (max-width: 640px) {
  body { padding: 30px 20px 60px; }
  header { align-items: flex-start; flex-direction: column; gap: 0; }
  header a { margin-bottom: 16px; }
  .controls { grid-template-columns: 1fr 1fr; }
  .controls #sort { grid-column: 1 / -1; }
  .item { padding: 18px 0; }
  .path { padding: 18px; }
}
@media (prefers-color-scheme: dark) {
  :root { --paper: #13221f; --surface: #1b2e29; --ink: #e4eee8; --muted: #aec1b6; --line: #40584e; --brand: #8bd5ba; --soft: #203b31; --accent: #e9b37e; }
  .tab.on, .mode button[aria-pressed="true"] { color: var(--paper); }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
}
</style></head><body>
<p class="eyebrow">DEV / READING ROOM</p>
<header><h1>전체 문서 검색</h1><div><a href="./hub.html">통합 자료 허브</a> · <a href="./index.html">최신 글로 돌아가기</a></div></header>
<p class="intro">수집된 과거 문서까지 제목·회사·요약에서 검색합니다. 원문은 출처 사이트에서 확인할 수 있습니다.</p>
<div class="controls"><input id="q" type="search" placeholder="예: JPA N+1, 장애, Kubernetes" aria-label="검색어">
<select id="region" aria-label="지역"><option value="">전체 지역</option><option value="KR">국내</option><option value="EN">해외</option></select>
<select id="topic" aria-label="기술 분야"><option value="">전체 기술</option><option>Backend</option><option>Frontend</option><option>Database</option><option>Infrastructure</option><option>AI/ML</option><option>Security</option><option>Architecture</option><option>Engineering</option></select><select id="sort" aria-label="정렬"><option value="recent">최신순</option><option value="relevance">관련도순</option></select></div>
<div class="mode" aria-label="검색 목적"><button type="button" id="mode-general" aria-pressed="true">일반 검색</button><button type="button" id="mode-solve" aria-pressed="false">문제 해결 경로</button></div><section id="path" class="path" hidden aria-live="polite"></section>
<p id="status" role="status">검색 색인을 불러오는 중입니다.</p><main id="results"></main><button id="more" hidden>결과 더 보기</button>
<script>
"use strict";
const $ = id => document.getElementById(id);
let articles = [], matches = [], visible = 0, mode = "general";
const PAGE = 30;
function normalize(s){return (s || "").toLocaleLowerCase().normalize("NFKC");}
function score(a,terms){
  const title=normalize(a.title), feed=normalize(a.feed), summary=normalize(a.summary);
  return terms.reduce((sum,t)=>sum+(title.includes(t)?5:0)+(feed.includes(t)?3:0)+(summary.includes(t)?1:0),0);
}
function search(){
  const terms=normalize($("q").value).trim().split(/\s+/).filter(Boolean);
  const region=$("region").value, topic=$("topic").value;
  matches=articles.filter(a=>(!region||a.region===region)&&(!topic||(a.topics||[]).includes(topic))&&terms.every(t=>score(a,[t])>0));
  if($("sort").value==="relevance"&&terms.length){
    matches.sort((a,b)=>score(b,terms)-score(a,terms)||((b.published||b.collected||"").localeCompare(a.published||a.collected||"")));
  }
  visible=0;$("results").replaceChildren();renderPath(terms);append();
}
function renderPath(terms){
  const panel=$("path");panel.replaceChildren();panel.hidden=mode!=="solve";
  if(panel.hidden)return;
  const heading=document.createElement("h2");heading.textContent="문제 해결 문서 경로 (자동 추천)";
  const note=document.createElement("p");note.className="meta";
  note.textContent="제목과 요약의 키워드로 분류한 참고 자료입니다. 실제 해결 순서나 정확성을 보증하지 않습니다.";
  panel.append(heading,note);
  if(!terms.length){const p=document.createElement("p");p.textContent="해결할 문제나 기술을 검색해 주세요.";panel.append(p);return;}
  const stages=[
    ["원인 파악",a=>a.content_type==="troubleshooting"],
    ["해결 방법 탐색",a=>a.content_type==="tutorial"||/해결|개선|fix|solution|workaround/i.test(a.title||"")],
    ["대안 비교",a=>a.content_type==="comparison"],
    ["실무 검증",a=>/테스트|검증|성능|benchmark|test|performance|latency/i.test((a.title||"")+" "+(a.summary||""))]
  ];
  const used=new Set(), list=document.createElement("ol");
  for(const [stage,predicate] of stages){
    const found=matches.filter(a=>!used.has(a.hash)&&predicate(a))
      .sort((a,b)=>score(b,terms)-score(a,terms))[0];
    if(!found)continue;
    used.add(found.hash);
    const li=document.createElement("li"), label=document.createElement("strong");
    label.textContent=stage+" · ";
    const a=document.createElement("a");a.href=found.url;a.target="_blank";a.rel="noopener noreferrer";a.textContent=found.title;
    const detail=document.createElement("small");detail.textContent=found.feed||"출처 미상";
    li.append(label,a,detail);list.append(li);
  }
  if(list.childElementCount)panel.append(list);
  else{const p=document.createElement("p");p.textContent="현재 검색 결과에서 단계별 추천 자료를 찾지 못했습니다.";panel.append(p);}
}
$("mode-general").addEventListener("click",()=>setMode("general"));
$("mode-solve").addEventListener("click",()=>setMode("solve"));
function setMode(next){
  mode=next;
  $("mode-general").setAttribute("aria-pressed",String(mode==="general"));
  $("mode-solve").setAttribute("aria-pressed",String(mode==="solve"));
  search();
}
function append(){
  const end=Math.min(visible+PAGE,matches.length);
  const frag=document.createDocumentFragment();
  for(let i=visible;i<end;i++){
    const a=matches[i],article=document.createElement("article");article.className="item";
    const link=document.createElement("a");link.href=a.url;link.target="_blank";link.rel="noopener noreferrer";link.textContent=a.title||"(제목 없음)";
    const meta=document.createElement("div");meta.className="meta";meta.textContent=[a.feed,a.published||a.collected,a.region,(a.topics||[]).join(", ")].filter(Boolean).join(" · ");
    const summary=document.createElement("p");summary.className="summary";summary.textContent=a.summary||"";
    article.append(link,meta,summary);frag.append(article);
  }
  $("results").append(frag);visible=end;$("more").hidden=visible>=matches.length;
  $("status").textContent=matches.length+"건 검색됨 · "+visible+"건 표시 / 전체 "+articles.length+"건";
}
$("more").addEventListener("click",append);
for(const id of ["q","region","topic","sort"])$(id).addEventListener(id==="q"?"input":"change",search);
const initialQuery = new URLSearchParams(window.location.search).get("q");
if (initialQuery) $("q").value = initialQuery.slice(0, 200);
fetch("./search-index.json").then(r=>{if(!r.ok)throw Error("HTTP "+r.status);return r.json();}).then(data=>{
  if(!Array.isArray(data))throw Error("Invalid index");
  articles=data;search();
}).catch(()=>{$("status").textContent="검색 색인을 불러오지 못했습니다. 잠시 후 다시 시도해 주세요.";});
</script></body></html>
