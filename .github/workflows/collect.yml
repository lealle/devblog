name: collect

on:
  schedule:
    # 수집은 매일. RSS 는 최근 10~20건만 담고 있어서, 글이 잦은 블로그는
    # 일주일에 한 번만 받으면 그 사이 글이 밀려나 사라진다.
    - cron: "0 21 * * 1-6"    # 월~토 UTC 21:00 = KST 06:00
    # 일요일에는 수집 후 화면까지 새로 만든다.
    - cron: "0 21 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: collect
  cancel-in-progress: false

env:
  # 렌더링과 배포를 할 차례인지. 일요일이거나 수동 실행일 때만 참.
  IS_WEEKLY: ${{ github.event.schedule == '0 21 * * 0' || github.event_name == 'workflow_dispatch' }}

jobs:
  collect:
    runs-on: ubuntu-latest
    outputs:
      weekly: ${{ env.IS_WEEKLY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 피드 목록 동기화
        if: github.event_name == 'workflow_dispatch'
        run: python scripts/sync_feeds.py

      - name: 수집
        run: python scripts/collect.py

      - name: 렌더링
        if: env.IS_WEEKLY == 'true'
        run: python scripts/render.py

      - name: 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ public/
          # 새 글이 없는 날엔 커밋할 게 없다. 그냥 commit 하면 실패로 표시된다.
          git diff --staged --quiet || git commit -m "collect: $(date -u +%Y-%m-%d)"
          git push

      - uses: actions/upload-pages-artifact@v3
        if: env.IS_WEEKLY == 'true'
        with:
          path: public

  deploy:
    needs: collect
    if: needs.collect.outputs.weekly == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
