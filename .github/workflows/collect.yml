name: collect

on:
  schedule:
    # 수집은 매일. RSS 는 최근 10~20건만 담고 있어서, 글이 잦은 블로그는
    # 일주일에 한 번만 받으면 그 사이 글이 밀려나 사라진다.
    - cron: "0 21 * * 1-6"    # 월~토 UTC 21:00 = KST 06:00
    # 일요일에는 수집 후 화면까지 새로 만들고 배포한다.
    - cron: "0 21 * * 0"
  workflow_dispatch:
    inputs:
      sync_feeds:
        description: "피드 목록을 원본 저장소에서 다시 받는다 (지운 피드가 되살아남)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    outputs:
      # env 컨텍스트는 job 의 outputs 에서 쓸 수 없다. 조건식을 그대로 적는다.
      weekly: ${{ github.event.schedule == '0 21 * * 0' || github.event_name == 'workflow_dispatch' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # 기본값이 false 라 평소엔 건너뛴다. 필요할 때만 실행 화면에서 체크.
      - name: 피드 목록 동기화
        if: inputs.sync_feeds
        run: |
          python scripts/sync_feeds.py
          python scripts/prune_feeds.py   # 동기화하면 죽은 피드가 되살아나므로 다시 정리

      - name: 수집
        run: python scripts/collect.py

      - name: 렌더링
        if: github.event.schedule == '0 21 * * 0' || github.event_name == 'workflow_dispatch'
        run: python scripts/render.py

      - name: 커밋
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # public 은 렌더링을 건너뛴 날엔 없을 수 있다. add 가 실패하지 않게 만들어 둔다.
          mkdir -p public data
          git add data public

          if git diff --staged --quiet; then
            echo "변경 사항 없음"
          else
            git commit -m "collect: $(date -u +%Y-%m-%d)"
            # 동시에 다른 실행이 밀어넣었을 경우를 대비
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - uses: actions/upload-pages-artifact@v3
        if: github.event.schedule == '0 21 * * 0' || github.event_name == 'workflow_dispatch'
        with:
          path: public

  deploy:
    needs: collect
    if: needs.collect.outputs.weekly == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
