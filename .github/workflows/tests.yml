name: tests
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Checkout design catalog
        uses: actions/checkout@v4
        with:
          repository: lealle/design-atlas
          ref: main
          path: _sources/design-atlas
          persist-credentials: false
          sparse-checkout: |
            docs/designs.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Unit tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Check browser JavaScript syntax
        run: |
          python -c "from pathlib import Path; s=Path('public/search.html').read_text(); Path('/tmp/devblog-search.js').write_text(s.split('<script>',1)[1].split('</script>',1)[0])"
          node --check /tmp/devblog-search.js
          node --check public/hub.js
          python -c "from pathlib import Path; s=Path('scripts/render.py').read_text(); import scripts.render as render; Path('/tmp/devblog-index.js').write_text(render.JS)"
          node --check /tmp/devblog-index.js
      - name: Build smoke test
        run: |
          python scripts/render.py
          python scripts/build_search_index.py
          python scripts/build_resource_hub.py
          python -c "import json; from pathlib import Path; p=Path('public/search-index.json'); a=json.loads(p.read_text()); assert isinstance(a,list); assert Path('public/search.html').exists(); print(len(a), 'articles indexed')"
          python -c "from pathlib import Path; assert all(Path('public',p).is_file() for p in ['blog-ui.css','hub-refresh.css','hub-data.json','hub.html','hub.js','search.html','index.html'])"
          python -c "import json; from pathlib import Path; data=json.loads(Path('public/hub-data.json').read_text(encoding='utf-8')); assert len(data['items'])>=142; assert len(data['source'])==1; assert all(x['kind']!='prompt' for x in data['items']); print(data['counts'])"
